[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxtrim"
version = "0.1.1"
description = "Budgeted trimmer for logs, HTML, Markdown, and JSON before they hit an agent context window."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "cli", "context", "tokens"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/ctxtrim"
Repository = "https://github.com/perron/ctxtrim"
Issues = "https://github.com/perron/ctxtrim/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctxtrim = "ctxtrim.cli:main"

[tool.setuptools.packages.find]
include = ["ctxtrim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
